global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: nekocafe-local

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  - job_name: reservation
    metrics_path: /metrics
    static_configs:
      - targets: ['reservation:8080']
        labels: { service: reservation }

  - job_name: member
    metrics_path: /metrics
    static_configs:
      - targets: ['member:8080']
        labels: { service: member }

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # 演示用，无 alertmanager；告警规则仍可在 Prometheus UI 看到
