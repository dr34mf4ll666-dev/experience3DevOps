{{- if .Values.observability.serviceMonitor.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "Values" $.Values "Release" $.Release "Chart" $.Chart "image" $svc.image -}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nekocafe.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nekocafe.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.observability.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
