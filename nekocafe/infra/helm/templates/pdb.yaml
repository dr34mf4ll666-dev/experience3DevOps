{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.pdb.enabled }}
{{- $ctx := dict "name" $name "Values" $.Values "Release" $.Release "Chart" $.Chart "image" $svc.image -}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nekocafe.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "nekocafe.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
