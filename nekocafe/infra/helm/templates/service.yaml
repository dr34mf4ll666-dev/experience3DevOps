{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "Values" $.Values "Release" $.Release "Chart" $.Chart "image" $svc.image -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nekocafe.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nekocafe.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nekocafe.labels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
