{{- /*
deployment.yaml — 为每个服务渲染一个 Deployment 或 Rollout
当 canary.enabled=true 时使用 Argo Rollouts；否则使用原生 Deployment。
*/ -}}

{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "name" $name "Values" $.Values "Release" $.Release "Chart" $.Chart "image" $svc.image -}}
---
{{- if $.Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nekocafe.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "nekocafe.selectorLabels" $ctx | nindent 6 }}
  {{- if $.Values.canary.enabled }}
  strategy:
    canary:
      steps:
        {{- toYaml $.Values.canary.steps | nindent 8 }}
      trafficRouting:
        nginx:
          stableIngress: {{ $.Release.Name }}-{{ $name }}
      analysis:
        templates:
          - templateName: {{ $.Release.Name }}-{{ $name }}-analysis
        startingStep: 1
  {{- else }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "nekocafe.selectorLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "nekocafe.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.observability.otel.endpoint }}
            - name: OTEL_DEPLOYMENT_ENV
              value: {{ $.Values.global.environment }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.externalSecret }}
                  key: db-dsn
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
{{- end }}
