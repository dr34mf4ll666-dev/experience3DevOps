{{- /*
ExternalSecret：从 Vault 拉取数据库密码、JWT 密钥等敏感信息，
渲染成原生 K8s Secret，集群内 Pod 才能引用。
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.externalSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.externalSecret }}
    creationPolicy: Owner
  data:
    - secretKey: db-dsn
      remoteRef:
        key: nekocafe/{{ .Values.global.environment }}/db
        property: dsn
    - secretKey: jwt-secret
      remoteRef:
        key: nekocafe/{{ .Values.global.environment }}/jwt
        property: secret
