name: nekocafe

services:
  # ------------ 业务服务 ------------
  reservation:
    build:
      context: ./services/reservation
      dockerfile: Dockerfile
    image: nekocafe/reservation:local
    ports:
      - "8081:8080"
    environment:
      - SERVICE_NAME=reservation
      - DB_DSN=postgres://neko:neko@postgres:5432/nekocafe?sslmode=disable
      - REDIS_ADDR=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=reservation
      - LOG_LEVEL=info
      - MEMBER_SERVICE_URL=http://member:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      otel-collector: { condition: service_started }
    restart: unless-stopped

  member:
    build:
      context: ./services/member
      dockerfile: Dockerfile
    image: nekocafe/member:local
    ports:
      - "8082:8080"
    environment:
      - SERVICE_NAME=member
      - DB_DSN=postgresql://neko:neko@postgres:5432/nekocafe
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=member
      - LOG_LEVEL=INFO
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    restart: unless-stopped

  # ------------ 数据 ------------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=neko
      - POSTGRES_PASSWORD=neko
      - POSTGRES_DB=nekocafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neko -d nekocafe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------ 可观测性（可选，注释掉可加快启动） ------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts:/etc/prometheus/alerts:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]

volumes:
  pgdata:
